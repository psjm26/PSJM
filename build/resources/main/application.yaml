server:
  port: ${PORT:8081}
  netty:
    connection-timeout: 5s
    idle-timeout: 15s

spring:
  application:
    name: sjm-backend
  main:
    banner-mode: "off"
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    time-zone: UTC

